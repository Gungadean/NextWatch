name: Cleanup Merged Branch

on:
  pull_request:
    types: [closed]

jobs:
  delete-feature-branch:
    runs-on: ubuntu-latest
    # This ensures the branch is only deleted if the PR was merged, not just closed.
    if: github.event.pull_request.merged == true

    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });
              console.log(`Successfully deleted branch: ${branchName}`);
            } catch (error) {
              console.log(`Could not delete branch ${branchName}. It might have already been deleted. Error: ${error.message}`);
            }